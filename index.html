<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Pengalaman WebXR Minimalis" />
    <meta name="theme-color" content="#ffffff" />
    <title>WebXR AR Experience</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      defer
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <!-- Desktop: Tampilan QR Code Minimalis -->
      <section id="desktopPanel" class="desktop-panel" hidden>
        <div class="content-wrapper">
          <h2>Pindai untuk Memulai</h2>
          <div id="qrCode" class="qr-code" aria-label="QR Code URL"></div>
          <a
            id="pageLink"
            class="page-link"
            href="#"
            target="_blank"
            rel="noopener"
            >Buka di perangkat ini</a
          >
        </div>
      </section>

      <!-- Mobile: Tampilan Tap Anywhere -->
      <section id="mobilePanel" class="mobile-panel" hidden>
        <div class="content-wrapper minimal-prompt">
          <h1>AR Experience</h1>
          <p id="statusText">Sentuh layar di mana saja untuk memulai</p>
        </div>
      </section>

      <!-- Overlay AR -->
      <div id="arOverlay" class="ar-overlay" hidden>
        <p id="instructionText">Arahkan kamera ke permukaan datar.</p>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
