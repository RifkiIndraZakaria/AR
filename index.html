<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Petualangan WebXR AR Seru untuk Anak!" />
    <meta name="theme-color" content="#87CEEB" />
    <title>Petualangan AR Seru! ✨</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Menambahkan font ceria dari Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      defer
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <!-- Desktop: tampilkan QR code dengan bahasa santai -->
      <section id="desktopPanel" class="desktop-panel" hidden>
        <div class="qr-card">
          <h1>Main AR Yuk! 🦖</h1>
          <div
            id="qrCode"
            class="qr-code"
            aria-label="QR Code URL halaman ini"
          ></div>
          <p>Minta tolong Ayah atau Bunda untuk scan kotak ini pakai HP ya!</p>
          <a
            id="pageLink"
            class="page-link"
            href="#"
            target="_blank"
            rel="noopener"
            >Atau klik di sini</a
          >
        </div>
      </section>

      <!-- Mobile: tampilkan tombol Start AR yang lucu -->
      <section id="mobilePanel" class="mobile-panel" hidden>
        <div class="mobile-card">
          <h1>Dunia AR! 🌟</h1>
          <button id="startArButton" class="start-button" type="button">
            Mulai Main! 🚀
          </button>
          <p id="statusText" class="status-text" role="status">
            Tunggu sebentar ya, lagi siap-siap...
          </p>
        </div>
      </section>

      <!-- Overlay AR dengan instruksi ceria -->
      <div id="arOverlay" class="ar-overlay" hidden>
        <p id="instructionText">Arahkan kameramu ke meja atau lantai ya! 📸</p>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
